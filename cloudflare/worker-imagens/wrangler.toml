# Configuração do worker de imagens — OPCIONAL.
#
# O caminho recomendado (docs/cloudflare-imagens.md) é publicar pelo site
# da Cloudflare, colando o worker.js no editor deles: não precisa instalar
# nada no computador. Este arquivo só existe para quem preferir publicar
# por linha de comando um dia:  npx wrangler deploy
name = "liveops-imagens"
main = "worker.js"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "IMAGENS"
bucket_name = "liveops-imagens"

# Etapa 2 — banco do espelho de dados. Pelo painel, o binding se faz em
# Settings → Bindings (variável DADOS → banco liveops-dados); este bloco
# serve só para deploy por linha de comando (preencha o database_id que
# aparece na tela do banco).
[[d1_databases]]
binding = "DADOS"
database_name = "liveops-dados"
database_id = "20b313cd-963c-4c4d-8584-f3c907124d12"
